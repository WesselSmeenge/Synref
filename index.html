<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synref</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #0a0a0a;
        color: #f0f0f0;
        font-family: 'Segoe UI', sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      h1 {
        font-size: 3rem;
        letter-spacing: 0.2rem;
        margin-bottom: 0.5rem;
      }

      .tagline {
        font-size: 1rem;
        color: #888;
        margin-bottom: 3rem;
        letter-spacing: 0.05rem;
      }

      nav {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: 300px;
      }

      nav a {
        display: block;
        padding: 1rem 1.5rem;
        border: 1px solid #333;
        color: #f0f0f0;
        text-decoration: none;
        font-size: 1rem;
        letter-spacing: 0.1rem;
        transition: all 0.2s ease;
      }

      nav a:hover {
        border-color: #f0f0f0;
        background-color: #111;
      }
    </style>
  </head>
  <body>
    <h1>SYNREF</h1>
    <p class="tagline">Reflect. Decide. Act.</p>
    <nav>
      <a href="solve.html">SOLVE</a>
      <a href="systems.html">SYSTEMS</a>
      <a href="train.html">TRAIN</a>
      <a href="quotes.html">QUOTES</a>
    </nav>
  </body>
</html>
